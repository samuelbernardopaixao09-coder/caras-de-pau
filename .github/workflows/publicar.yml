          from PIL import Image,ImageDraw,ImageChops
          BG=(27,34,42)
          L=Image.open('logo_l.png').convert('L')
          def logo(size,scale,circle=False):
              out=Image.new('RGBA',(size,size),BG+(255,))
              if circle:
                  out=Image.new('RGBA',(size,size),(0,0,0,0));ImageDraw.Draw(out).ellipse([0,0,size-1,size-1],fill=BG+(255,))
              n=int(size*scale);m=L.resize((n,n),Image.BICUBIC)
              c=Image.new('L',(n,n),0);ImageDraw.Draw(c).ellipse([int(n*.04),int(n*.04),int(n*.96),int(n*.96)],fill=255)
              m=ImageChops.multiply(m,c)
              out.paste(Image.new('RGBA',(n,n),(255,255,255,255)),((size-n)//2,(size-n)//2),m);return out
          logo(512,1.25).convert('RGB').save('site/icon-512.png');logo(192,1.25).convert('RGB').save('site/icon-192.png')
